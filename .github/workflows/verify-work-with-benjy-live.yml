name: Temporary Work with Benjy live verification

on:
  pull_request:
    paths:
      - '.github/workflows/verify-work-with-benjy-live.yml'
      - 'docs/awakening-eden/handoffs/CURRENT.md'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Confirm merged Work with Benjy release is live
        env:
          SITE: https://awakening-eden-library-staging.holisticmission8.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 30 "$SITE/work-with-benjy" -o work-with-benjy.html \
              && grep -Fq 'eden-work-vnext.css?v=2026-09-21.1' work-with-benjy.html \
              && grep -Fq 'eden-work-v23.js?v=2026-09-21.1' work-with-benjy.html \
              && grep -Fq 'Land Clarity &amp; Action Session' work-with-benjy.html \
              && grep -Fq 'Focused Regenerative Roadmap' work-with-benjy.html \
              && grep -Fq 'Holistic Regenerative Concept Masterplan' work-with-benjy.html \
              && grep -Fq 'Contour Food Forest Ideas' work-with-benjy.html \
              && grep -Fq 'Syntropifying: Abundant Food Forest Berrylicious Terrace Gardens' work-with-benjy.html \
              && grep -Fq 'WhatsApp Benjy · Book the €111 Clarity Call' work-with-benjy.html; then
              echo "Merged Work with Benjy release is live on Cloudflare."
              exit 0
            fi
            echo "Release not visible yet (attempt $attempt/30)."
            sleep 10
          done
          echo "Cloudflare did not expose the merged Work with Benjy release within five minutes." >&2
          exit 1
