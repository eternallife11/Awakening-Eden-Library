name: Temporary Work with Benjy live verification

on:
  pull_request:
    paths:
      - '.github/workflows/verify-work-with-benjy-live.yml'
      - 'docs/awakening-eden/handoffs/CURRENT.md'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Confirm merged Work with Benjy release is live
        env:
          SITE: https://awakening-eden-library-staging.holisticmission8.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 30 "$SITE/work-with-benjy" -o work-with-benjy.html \
              && grep -Fq 'eden-work-vnext.css?v=2026-09-21.1' work-with-benjy.html \
              && grep -Fq 'eden-work-v23.js?v=2026-09-21.1' work-with-benjy.html \
              && grep -Fq 'Land Clarity &amp; Action Session' work-with-benjy.html \
              && grep -Fq 'Focused Regenerative Roadmap' work-with-benjy.html \
              && grep -Fq 'Holistic Regenerative Concept Masterplan' work-with-benjy.html \
              && grep -Fq 'Contour Food Forest Ideas' work-with-benjy.html \
              && grep -Fq 'Syntropifying: Abundant Food Forest Berrylicious Terrace Gardens' work-with-benjy.html \
              && grep -Fq 'WhatsApp Benjy · Book the €111 Clarity Call' work-with-benjy.html; then
              echo "Merged Work with Benjy release is live on Cloudflare."
              exit 0
            fi
            echo "Release not visible yet (attempt $attempt/30)."
            sleep 10
          done
          echo "Cloudflare did not expose the merged Work with Benjy release within five minutes." >&2
          exit 1


  visual-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install pinned QA dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check live page and capture desktop + mobile
        shell: bash
        run: |
          mkdir -p test-results/live-review
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const site = 'https://awakening-eden-library-staging.holisticmission8.workers.dev/work-with-benjy';
          const browser = await chromium.launch();

          for (const view of [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 }
          ]) {
            const page = await browser.newPage({ viewport: { width: view.width, height: view.height } });
            await page.route('https://challenges.cloudflare.com/**', route => route.abort());
            const response = await page.goto(site, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
            if (!response || response.status() !== 200) throw new Error(`${view.name}: unexpected status ${response?.status()}`);

            await page.evaluate(async () => {
              const images = Array.from(document.images).filter((image) => !image.closest('[hidden]'));
              for (const image of images) {
                image.loading = 'eager';
                image.removeAttribute('loading');
                image.scrollIntoView({ block: 'center' });
                if (!image.complete) {
                  await Promise.race([
                    new Promise((resolve) => image.addEventListener('load', resolve, { once: true })),
                    new Promise((resolve) => setTimeout(resolve, 2500))
                  ]);
                }
              }
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(800);

            const brokenImages = await page.evaluate(() => Array.from(document.images)
              .filter((image) => {
                const rect = image.getBoundingClientRect();
                const visible = rect.width > 0 && rect.height > 0;
                return visible && (!image.complete || image.naturalWidth === 0);
              })
              .map((image) => image.getAttribute('src')));
            if (brokenImages.length) throw new Error(`${view.name}: broken images ${JSON.stringify(brokenImages)}`);

            for (const expected of [
              'Land Clarity & Action Session',
              'Focused Regenerative Roadmap',
              'Holistic Regenerative Concept Masterplan',
              'Contour Food Forest Ideas',
              'Syntropifying: Abundant Food Forest Berrylicious Terrace Gardens'
            ]) {
              if (!(await page.getByText(expected, { exact: false }).first().isVisible())) {
                throw new Error(`${view.name}: missing visible text: ${expected}`);
              }
            }

            const whatsappCount = await page.locator('a[href^="https://wa.me/351920067347"]').count();
            if (whatsappCount < 5) throw new Error(`${view.name}: expected multiple WhatsApp pathways, found ${whatsappCount}`);

            const widths = await page.evaluate(() => ({
              viewport: window.innerWidth,
              document: document.documentElement.scrollWidth,
              body: document.body.scrollWidth
            }));
            if (widths.document > widths.viewport + 1 || widths.body > widths.viewport + 1) {
              throw new Error(`${view.name}: horizontal overflow ${JSON.stringify(widths)}`);
            }

            await page.screenshot({
              path: `test-results/live-review/work-with-benjy-${view.name}.png`,
              fullPage: true
            });
            await page.close();
          }

          await browser.close();
          NODE

      - name: Upload live review screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: work-with-benjy-live-review
          path: test-results/live-review/
          if-no-files-found: error
          retention-days: 5
          compression-level: 9
