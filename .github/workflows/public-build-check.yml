name: Public build safety check

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-public-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build Cloudflare public artifact
        env:
          ENQUIRY_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: node scripts/build-cloudflare.mjs

      - name: Verify required public files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_redirects
          test -f dist/_headers
          test -f dist/robots.txt

      - name: Verify internal sources are not public
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/docs
          test ! -e dist/deliverables
          test ! -e dist/scripts
          test ! -e dist/tests
          test ! -e dist/workers
          test ! -e dist/node_modules
          test ! -e dist/netlify.toml
          test ! -e dist/wrangler.toml
          test ! -e dist/wrangler.jsonc
          test ! -e dist/package.json
          test ! -e dist/pnpm-lock.yaml
          test ! -e dist/pnpm-workspace.yaml
          test ! -e dist/playwright.config.mjs
          test ! -e dist/AGENTS.md
          test ! -e dist/eden-enquiry.js.map
          test ! -e dist/orchard-before-dry-monoculture.webp
          test ! -e dist/orchard-after-abundant-green.webp
          if find dist -type f \( -iname '*.zip' -o -iname '*.md' -o -iname '*.psd' -o -iname '*.xcf' \) -print -quit | grep -q .; then
            echo 'Internal/source file type found in public artifact.' >&2
            exit 1
          fi

      - name: Verify Cloudflare redirect compatibility
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '[[:space:]](200|301|302|303|307|308|404)!([[:space:]]|$)' dist/_redirects; then
            echo 'Netlify force marker remains in Cloudflare redirects.' >&2
            exit 1
          fi
          if grep -nE '[[:space:]]404([[:space:]]|$)' dist/_redirects; then
            echo 'Unsupported Cloudflare 404 rewrite remains in redirects.' >&2
            exit 1
          fi
          if grep -nE '[[:space:]]200([[:space:]]|$)' dist/_redirects; then
            echo 'Unsupported Cloudflare 200 rewrite remains in redirects.' >&2
            exit 1
          fi
          test -f dist/living-library.html
          test -f dist/start-here.html
          test -f dist/thriving-in-these-times.html
          test -f dist/7-first-steps-regenerate-your-land.html
          test -f dist/abundant-edge-index.html
          test -f dist/small-scale-regenerative-farm-playbook.html

      - name: Verify Cloudflare preview safeguards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'workers.dev/\*' dist/_headers
          grep -q 'X-Robots-Tag: noindex, nofollow' dist/_headers
          grep -q '^/living-library$' dist/_headers
          grep -q '^/work-with-benjy$' dist/_headers
          grep -q 'challenges.cloudflare.com' dist/_headers

      - name: Validate Workers Static Assets configuration
        run: npx --yes wrangler@4.122.0 deploy --dry-run

      - name: Verify Cloudflare static asset size ceiling
        shell: bash
        run: |
          set -euo pipefail
          oversized="$(find dist -type f -size +25M -print -quit)"
          if [ -n "$oversized" ]; then
            echo "Oversized public asset: $oversized" >&2
            exit 1
          fi

      - name: Public build summary
        shell: bash
        run: |
          echo "Files: $(find dist -type f | wc -l)"
          du -sh dist

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install pinned QA dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop and mobile browser QA
        run: pnpm test:browser

      - name: Run enquiry Worker unit tests
        run: pnpm test:worker

      - name: Upload compact review screenshots
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: awakening-eden-browser-review-${{ github.run_attempt }}
          path: |
            test-results/review/desktop-chromium/
            test-results/review/mobile-chromium/
          if-no-files-found: warn
          retention-days: 5
          compression-level: 9

      - name: Upload compact browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: awakening-eden-browser-failure-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/review/desktop-chromium/
            test-results/review/mobile-chromium/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
