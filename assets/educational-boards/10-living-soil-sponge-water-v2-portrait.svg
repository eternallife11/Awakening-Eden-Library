<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2280" width="900" height="2280" role="img" aria-labelledby="t d"><title id="t">From runoff to a living soil sponge</title><desc id="d">Bare, compacted soil sheds rain as fast runoff; covered soil with living roots, pores and biology lets water infiltrate. Adding one volumetric percentage point of plant-available water across 30 cm of soil equals 3 litres per square metre, or 30,000 litres per hectare. This is arithmetic, not a promise about organic matter.</desc><defs><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter><filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14" result="d"/><feGaussianBlur in="d" stdDeviation=".6"/></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b98d45"/></marker><marker id="aw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f8c8c"/></marker><linearGradient id="skyA" x2="0" y2="1"><stop stop-color="#f6e7cf"/><stop offset="1" stop-color="#f1dcc0"/></linearGradient><linearGradient id="skyB" x2="0" y2="1"><stop stop-color="#eef0df"/><stop offset="1" stop-color="#e3ead6"/></linearGradient><linearGradient id="soilA" x2="0" y2="1"><stop stop-color="#c99c74"/><stop offset="1" stop-color="#a56f52"/></linearGradient><linearGradient id="soilB" x2="0" y2="1"><stop stop-color="#8a6446"/><stop offset="1" stop-color="#5e4331"/></linearGradient></defs><rect width="900" height="2280" rx="36" fill="#f3ebd7"/><rect width="900" height="2280" rx="36" fill="#f3ebd7" filter="url(#grain)"/><text x="450" y="92" font-family="Georgia,'Times New Roman',serif" font-size="46" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="450" dy="0">FROM RUNOFF TO A</tspan></text><text x="450" y="148" font-family="Georgia,'Times New Roman',serif" font-size="46" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="450" dy="0">LIVING SOIL SPONGE</tspan></text><text x="450" y="200" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Cover · roots · structure · time</tspan></text><rect x="60" y="240" width="780" height="660" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="450" y="300" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="33" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="450" dy="0">BARE / COMPACTED</tspan></text><g transform="translate(105 335) scale(1.21)"><g transform="translate(0 0)"><path d="M70 10 V95" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M70 115 V175" stroke="#4f8c8c" stroke-width="5" stroke-dasharray="10 12" opacity=".5"/><path d="M150 10 V95" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M150 115 V175" stroke="#4f8c8c" stroke-width="5" stroke-dasharray="10 12" opacity=".5"/><path d="M230 10 V95" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M230 115 V175" stroke="#4f8c8c" stroke-width="5" stroke-dasharray="10 12" opacity=".5"/><g stroke="#b98d45" stroke-width="8" stroke-linecap="round"><circle cx="470" cy="60" r="44" fill="#b98d45" stroke="none"/><path d="M470 -12V2M470 118V132M392 60H406M534 60H548"/></g><g filter="url(#rough)"><path d="M0 215 Q250 185 570 220 L570 350 L0 350Z" fill="url(#soilA)"/><path d="M0 215 Q250 185 570 220" stroke="#7a5a3f" stroke-width="10" fill="none"/></g><path d="M40 197 Q270 181 510 207" stroke="#4f8c8c" stroke-width="9" fill="none" stroke-linecap="round" marker-end="url(#aw)"/></g></g><text x="450" y="820" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Fast runoff · hot surface</tspan><tspan x="450" dy="42.0">erosion risk · fewer pores</tspan></text><rect x="60" y="930" width="780" height="660" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="450" y="990" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="33" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="450" dy="0">COVERED / LIVING</tspan></text><g transform="translate(105 1025) scale(1.21)"><g transform="translate(0 0)"><path d="M60 10 V75" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M140 10 V75" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M220 10 V75" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><g filter="url(#rough)"><path d="M0 200 L570 200 L570 350 L0 350Z" fill="url(#soilB)"/></g><path d="M20 197 l80 -8" stroke="#c9a46e" stroke-width="12" stroke-linecap="round"/><path d="M120 197 l80 -8" stroke="#c9a46e" stroke-width="12" stroke-linecap="round"/><path d="M220 197 l80 -8" stroke="#c9a46e" stroke-width="12" stroke-linecap="round"/><path d="M320 197 l80 -8" stroke="#c9a46e" stroke-width="12" stroke-linecap="round"/><path d="M420 197 l80 -8" stroke="#c9a46e" stroke-width="12" stroke-linecap="round"/><g fill="none" stroke="#5f7445" stroke-width="7" stroke-linecap="round"><path d="M100 195 V100"/><path d="M100 130 C70 95 30 100 20 122"/><path d="M100 130 C130 95 170 100 180 122"/></g><g fill="none" stroke="#e0c9a6" stroke-width="3.5" stroke-linecap="round" opacity=".75"><path d="M100 205 C80 255 60 290 40 340"/><path d="M100 205 C110 265 130 300 120 340"/></g><g fill="none" stroke="#5f7445" stroke-width="7" stroke-linecap="round"><path d="M300 195 V100"/><path d="M300 130 C270 95 230 100 220 122"/><path d="M300 130 C330 95 370 100 380 122"/></g><g fill="none" stroke="#e0c9a6" stroke-width="3.5" stroke-linecap="round" opacity=".75"><path d="M300 205 C280 255 260 290 240 340"/><path d="M300 205 C310 265 330 300 320 340"/></g><g fill="none" stroke="#5f7445" stroke-width="7" stroke-linecap="round"><path d="M480 195 V100"/><path d="M480 130 C450 95 410 100 400 122"/><path d="M480 130 C510 95 550 100 560 122"/></g><g fill="none" stroke="#e0c9a6" stroke-width="3.5" stroke-linecap="round" opacity=".75"><path d="M480 205 C460 255 440 290 420 340"/><path d="M480 205 C490 265 510 300 500 340"/></g><path d="M50 215 V330" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M150 215 V330" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M250 215 V330" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M360 215 V330" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M450 215 V330" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M530 215 V330" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/></g></g><text x="450" y="1510" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">More time to soak in</tspan><tspan x="450" dy="42.0">roots and soil life move water down</tspan></text><rect x="60" y="1630" width="780" height="400" rx="28" fill="#ead9b4" stroke="#b98d45" stroke-width="3"/><text x="450" y="1692" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.4"><tspan x="450" dy="0">WATER STORAGE IS MEASURABLE</tspan></text><text x="450" y="1742" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">+1 volumetric percentage point of</tspan><tspan x="450" dy="37.8">plant-available water across 30 cm of soil</tspan></text><text x="450" y="1852" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="700" fill="#2f6461" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">= 3 L/m²</tspan></text><text x="450" y="1912" font-family="Georgia,'Times New Roman',serif" font-size="33" font-weight="700" fill="#2f6461" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">= 30,000 L/ha of water capacity</tspan></text><text x="450" y="1972" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Purely geometric conversion.</tspan></text><text x="450" y="2100" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Not a “+1% organic matter = X water”</tspan><tspan x="450" dy="36.4">promise. Texture, structure, compaction,</tspan><tspan x="450" dy="36.4">rooting depth and carbon all matter.</tspan></text></svg>