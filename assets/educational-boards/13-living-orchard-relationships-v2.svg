span></text><rect x="830" y="160" width="700" height="720" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="1180" y="215" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1.2"><tspan x="1180" dy="0">COVERED &amp; DIVERSIFIED</tspan></text><g transform="translate(860 240)"><rect x="0" y="0" width="640" height="420" rx="18" fill="url(#skyB)"/><path d="M90 30 l-10 40" stroke="#4f8c8c" stroke-width="5" stroke-linecap="round" opacity=".8"/><path d="M170 30 l-10 40" stroke="#4f8c8c" stroke-width="5" stroke-linecap="round" opacity=".8"/><path d="M250 30 l-10 40" stroke="#4f8c8c" stroke-width="5" stroke-linecap="round" opacity=".8"/><path d="M330 30 l-10 40" stroke="#4f8c8c" stroke-width="5" stroke-linecap="round" opacity=".8"/><g filter="url(#wash)"><path d="M-10 300 C140 250 330 255 650 300 L650 430 L-10 430Z" fill="url(#soilB)"/></g><g filter="url(#wash)"><path d="M-10 296 C140 246 330 251 650 296 L650 312 C330 268 140 266 -10 314Z" fill="#c9a46e"/></g><g fill="none" stroke-linecap="round"><g stroke="#e0c9a6" stroke-width="4" opacity=".85"><path d="M330 290 C310 330 280 360 250 405"/><path d="M330 290 C335 340 345 370 360 410"/><path d="M330 290 C360 320 400 340 440 360"/><path d="M150 290 C140 330 130 360 120 400"/><path d="M520 300 C530 340 520 370 535 405"/></g><g stroke="#f3e6cf" stroke-width="1.6" opacity=".7"><path d="M250 380 C200 370 170 390 120 380"/><path d="M360 395 C410 380 460 395 535 385"/><path d="M440 360 C470 350 500 360 520 340"/></g></g><path d="M60 320 V400" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round"/><path d="M190 320 V400" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round"/><path d="M270 320 V400" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round"/><path d="M410 320 V400" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round"/><path d="M480 320 V400" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round"/><path d="M590 320 V400" stroke="#9fd0cb" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round"/><g filter="url(#wash)"><ellipse cx="70" cy="267.3" rx="42.5" ry="34" fill="#7f9a5e"/><ellipse cx="140" cy="271.7" rx="32.5" ry="26" fill="#93ab6c"/><ellipse cx="450" cy="262.9" rx="52.5" ry="42" fill="#6f8a55"/><ellipse cx="520" cy="268.4" rx="40.0" ry="32" fill="#88a064"/><ellipse cx="600" cy="270.6" rx="35.0" ry="28" fill="#93ab6c"/><ellipse cx="215" cy="273.9" rx="27.5" ry="22" fill="#88a064"/></g><circle cx="110" cy="268" r="7" fill="#b98fc9"/><circle cx="150" cy="268" r="7" fill="#e0a43c"/><circle cx="470" cy="268" r="7" fill="#c56f7a"/><circle cx="505" cy="261" r="7" fill="#b98fc9"/><circle cx="590" cy="268" r="7" fill="#e0a43c"/><circle cx="205" cy="261" r="7" fill="#c56f7a"/><g transform="translate(330 288) scale(1.0)"><g filter="url(#wash)"><path d="M-9 0 C-6 -40 -12 -80 -4 -115 L6 -115 C12 -80 8 -40 12 0Z" fill="#6d5238"/><path d="M2 -70 C20 -90 34 -100 52 -112" stroke="#6d5238" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M0 -60 C-18 -80 -34 -92 -50 -104" stroke="#6d5238" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="-70" cy="-150" r="62" fill="#6f8a55" opacity=".93"/><circle cx="0" cy="-185" r="70" fill="#86a066" opacity=".93"/><circle cx="70" cy="-150" r="62" fill="#a4b97d" opacity=".93"/><circle cx="-38" cy="-110" r="55" fill="#6f8a55" opacity=".93"/><circle cx="40" cy="-110" r="55" fill="#86a066" opacity=".93"/><circle cx="0" cy="-135" r="60" fill="#a4b97d" opacity=".93"/><circle cx="-60" cy="-140" r="9" fill="#e0a43c"/><circle cx="30" cy="-170" r="9" fill="#e0a43c"/><circle cx="62" cy="-120" r="9" fill="#e0a43c"/><circle cx="-20" cy="-100" r="9" fill="#e0a43c"/><circle cx="10" cy="-150" r="9" fill="#e0a43c"/></g></g><path d="M500 120 q12 -10 24 0 q12 -10 24 0" stroke="#3f4f3a" stroke-width="4" fill="none" stroke-linecap="round"/></g><circle cx="890" cy="713.68" r="5.72" fill="#5f7445"/><text x="909.5" y="722.0" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#5f4f3c" text-anchor="start" letter-spacing="0"><tspan x="909.5" dy="0">Mulch and living cover shade the soil</tspan></text><circle cx="890" cy="753.9799999999999" r="5.72" fill="#5f7445"/><text x="909.5" y="762.3" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#5f4f3c" text-anchor="start" letter-spacing="0"><tspan x="909.5" dy="0">More rain can soak in where it falls</tspan></text><circle cx="890" cy="794.28" r="5.72" fill="#5f7445"/><text x="909.5" y="802.6" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#5f4f3c" text-anchor="start" letter-spacing="0"><tspan x="909.5" dy="0">Roots and fungi build soil structure</tspan></text><circle cx="890" cy="834.5799999999999" r="5.72" fill="#5f7445"/><text x="909.5" y="842.9" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#5f4f3c" text-anchor="start" letter-spacing="0"><tspan x="909.5" dy="0">Varied plants feed pollinators and birds</tspan></text><text x="800" y="925" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0">Fit water, species and earthworks to the actual site: observe slope, soil, rainfall and fire exposure, and plan safe overflow.</tspan></text><text x="800" y="965" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#6b6650" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0">Illustrative concept · not matched before/after imagery · not a surveyed drainage or earthworks plan</tspan></text></svg>