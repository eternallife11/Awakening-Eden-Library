<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" role="img" aria-labelledby="t d"><title id="t">From exposed ground toward a living orchard</title><desc id="d">Illustrated comparison of two design conditions, not a before-and-after. Left: an orchard tree on bare, sun-baked ground where rain runs off and carries soil. Right: the same kind of tree with mulch, living groundcover, support shrubs and herbs, where more rain can soak in and roots and soil life build structure. Water, species and earthworks must fit the actual site.</desc><defs><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter><filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14" result="d"/><feGaussianBlur in="d" stdDeviation=".6"/></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b98d45"/></marker><marker id="aw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f8c8c"/></marker><linearGradient id="skyA" x2="0" y2="1"><stop stop-color="#f6e7cf"/><stop offset="1" stop-color="#f1dcc0"/></linearGradient><linearGradient id="skyB" x2="0" y2="1"><stop stop-color="#eef0df"/><stop offset="1" stop-color="#e3ead6"/></linearGradient><linearGradient id="soilA" x2="0" y2="1"><stop stop-color="#c99c74"/><stop offset="1" stop-color="#a56f52"/></linearGradient><linearGradient id="soilB" x2="0" y2="1"><stop stop-color="#8a6446"/><stop offset="1" stop-color="#5e4331"/></linearGradient></defs><rect width="1600" height="1010" rx="36" fill="#f3ebd7"/><rect width="1600" height="1010" rx="36" fill="#f3ebd7" filter="url(#grain)"/><text x="800" y="82" font-family="Georgia,'Times New Roman',serif" font-size="46" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="800" dy="0">FROM EXPOSED GROUND TOWARD A LIVING ORCHARD</tspan></text><text x="800" y="128" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0">An illustrated comparison of two design conditions · not a before-and-after</tspan></text><rect x="70" y="160" width="700" height="720" rx="28" fill="#fdf9ef" stroke="#c7a58a" stroke-width="3"/><text x="420" y="215" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1.2"><tspan x="420" dy="0">EXPOSED GROUND</tspan></text><g transform="translate(100 240)"><rect x="0" y="0" width="640" height="420" rx="18" fill="url(#skyA)"/><path d="M90 30 l-10 40" stroke="#4f8c8c" stroke-width="5" stroke-linecap="round" opacity=".8"/><path d="M170 30 l-10 40" stroke="#4f8c8c" stroke-width="5" stroke-linecap="round" opacity=".8"/><path d="M250 30 l-10 40" stroke="#4f8c8c" stroke-width="5" stroke-linecap="round" opacity=".8"/><path d="M330 30 l-10 40" stroke="#4f8c8c" stroke-width="5" stroke-linecap="round" opacity=".8"/><g stroke="#b98d45" stroke-width="7" stroke-linecap="round"><circle cx="560" cy="70" r="36" fill="#b98d45" stroke="none"/><path d="M560 14V24M560 116V126M504 70H514M606 70H616"/></g><g filter="url(#wash)"><path d="M-10 300 C140 250 330 255 650 300 L650 430 L-10 430Z" fill="url(#soilA)"/></g><path d="M10 300 C140 258 330 262 630 302" stroke="#8d6246" st