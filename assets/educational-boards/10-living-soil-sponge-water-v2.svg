<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-labelledby="t d"><title id="t">From runoff to a living soil sponge</title><desc id="d">Bare, compacted soil sheds rain as fast runoff; covered soil with living roots, pores and biology lets water infiltrate. Adding one volumetric percentage point of plant-available water across 30 cm of soil equals 3 litres per square metre, or 30,000 litres per hectare.</desc><rect width="1600" height="1040" rx="36" fill="#f3ebd7"/><text x="800" y="82" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="800" dy="0.0">FROM RUNOFF TO A LIVING SOIL SPONGE</tspan></text><text x="800" y="130" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0.0">Cover · roots · structure · organic inputs · time for water to enter</tspan></text><rect x="80" y="165" width="670" height="560" rx="30" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="415" y="220" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="415" dy="0.0">BARE / COMPACTED</tspan></text><rect x="850" y="165" width="670" height="560" rx="30" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="1185" y="220" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="1185" dy="0.0">COVERED / LIVING</tspan></text><path d="M200 255 V350" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M200 370 V440" stroke="#4f8c8c" stroke-width="5" stroke-dasharray="10 12" opacity=".55"/><path d="M280 255 V350" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M280 370 V440" stroke="#4f8c8c" stroke-width="5" stroke-dasharray="10 12" opacity=".55"/><path d="M360 255 V350" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M360 370 V440" stroke="#4f8c8c" stroke-width="5" stroke-dasharray="10 12" opacity=".55"/><g stroke="#b98d45" stroke-width="8" stroke-linecap="round"><circle cx="600" cy="300" r="48" fill="#b98d45" stroke="none"/><path d="M600 222V236M600 364V378M522 300H536M664 300H678"/></g><path d="M130 470 Q380 440 700 475 L700 610 L130 610Z" fill="#c09a76"/><path d="M130 470 Q380 440 700 475" stroke="#7a5a3f" stroke-width="10" fill="none"/><path d="M170 452 Q400 436 640 462" stroke="#4f8c8c" stroke-width="9" fill="none" stroke-linecap="round" marker-end="url(#aw)"/><defs><marker id="aw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f8c8c"/></marker></defs><text x="415" y="660" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="415" dy="0.0">Fast runoff · hot surface · erosion risk</tspan><tspan x="415" dy="33.0">fewer pores and fewer living pathways</tspan></text><path d="M960 255 V330" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M1040 255 V330" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M1120 255 V330" stroke="#4f8c8c" stroke-width="7" stroke-linecap="round"/><path d="M900 455 L1470 455 L1470 610 L900 610Z" fill="#8a6446"/><path d="M920 452 l80 -8" stroke="#c9a46e" stroke-width="12" stroke-linecap="round"/><path d="M1020 452 l80 -8" stroke="#c9a46e" stroke-width="12" stroke-linecap="round"/><path d="M1120 452 l80 -8" stroke="#c9a46e" stroke-width="12" stroke-linecap="round"/><path d="M1220 452 l80 -8" stroke="#c9a46e" stroke-width="12" stroke-linecap="round"/><path d="M1320 452 l80 -8" stroke="#c9a46e" stroke-width="12" stroke-linecap="round"/><g fill="none" stroke="#5f7445" stroke-width="7" stroke-linecap="round"><path d="M1010 450 V350"/><path d="M1010 380 C980 345 940 350 930 372"/><path d="M1010 380 C1040 345 1080 350 1090 372"/></g><g fill="none" stroke="#5a3f2a" stroke-width="4" stroke-linecap="round" opacity=".8"><path d="M1010 460 C990 510 970 550 950 600"/><path d="M1010 460 C1020 520 1040 560 1030 600"/></g><g fill="none" stroke="#5f7445" stroke-width="7" stroke-linecap="round"><path d="M1220 450 V350"/><path d="M1220 380 C1190 345 1150 350 1140 372"/><path d="M1220 380 C1250 345 1290 350 1300 372"/></g><g fill="none" stroke="#5a3f2a" stroke-width="4" stroke-linecap="round" opacity=".8"><path d="M1220 460 C1200 510 1180 550 1160 600"/><path d="M1220 460 C1230 520 1250 560 1240 600"/></g><path d="M950 470 V585" stroke="#8fc1bd" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M1050 470 V585" stroke="#8fc1bd" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M1150 470 V585" stroke="#8fc1bd" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M1260 470 V585" stroke="#8fc1bd" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M1360 470 V585" stroke="#8fc1bd" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M1430 470 V585" stroke="#8fc1bd" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><text x="1185" y="660" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="1185" dy="0.0">More time to infiltrate · cooler surface</tspan><tspan x="1185" dy="33.0">roots + pores + biology help water move through soil</tspan></text><rect x="180" y="760" width="1240" height="190" rx="30" fill="#ead9b4" stroke="#b98d45" stroke-width="3"/><text x="800" y="812" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.5"><tspan x="800" dy="0.0">WATER STORAGE IS MEASURABLE: USE THE SOIL, NOT A SLOGAN</tspan></text><text x="800" y="852" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0.0">+1 volumetric percentage point of plant-available water across 30 cm of soil</tspan></text><text x="800" y="896" font-family="Georgia,'Times New Roman',serif" font-size="32" font-weight="700" fill="#3d6f6c" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0.0">= 3 L/m² = 30,000 L/ha of additional plant-available water capacity</tspan></text><text x="800" y="932" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0.0">Example: +2 points across 30 cm = 6 L/m² = 60,000 L/ha · purely geometric conversion.</tspan></text><text x="800" y="995" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0.0">Not a “+1% organic matter = X water” promise. Texture, structure, compaction, rooting depth and organic carbon all influence plant-available water.</tspan></text></svg>