<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-labelledby="t d"><title id="t">Biomass: stored sunlight in motion</title><desc id="d">A five-step loop: photosynthesis grows biomass; it is managed at the right time; returned to the ground; decomposers transform it; and the next growth inherits shade, habitat and recycled nutrients. Mediterranean note: biomass is also potential dry fuel.</desc><defs><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter><filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14" result="d"/><feGaussianBlur in="d" stdDeviation=".6"/></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b98d45"/></marker><marker id="aw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f8c8c"/></marker><linearGradient id="skyA" x2="0" y2="1"><stop stop-color="#f6e7cf"/><stop offset="1" stop-color="#f1dcc0"/></linearGradient><linearGradient id="skyB" x2="0" y2="1"><stop stop-color="#eef0df"/><stop offset="1" stop-color="#e3ead6"/></linearGradient><linearGradient id="soilA" x2="0" y2="1"><stop stop-color="#c99c74"/><stop offset="1" stop-color="#a56f52"/></linearGradient><linearGradient id="soilB" x2="0" y2="1"><stop stop-color="#8a6446"/><stop offset="1" stop-color="#5e4331"/></linearGradient></defs><rect width="1600" height="1040" rx="36" fill="#f3ebd7"/><rect width="1600" height="1040" rx="36" fill="#f3ebd7" filter="url(#grain)"/><text x="800" y="82" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="800" dy="0">BIOMASS: STORED SUNLIGHT IN MOTION</tspan></text><text x="800" y="130" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0">Grow it · manage it · return it · let the next succession rise through it</tspan></text><path d="M1125 265 C1220 285 1270 330 1285 385" fill="none" stroke="#b98d45" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/><path d="M1290 615 C1290 650 1250 675 1220 685" fill="none" stroke="#b98d45" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/><path d="M875 790 C850 790 800 790 770 790" fill="none" stroke="#b98d45" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/><path d="M300 685 C290 660 300 640 310 618" fill="none" stroke="#b98d45" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/><path d="M310 390 C330 300 400 270 472 262" fill="none" stroke="#b98d45" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="480" y="165" width="640" height="200" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="800.0" y="219" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.4"><tspan x="800.0" dy="0">1 · PHOTOSYNTHESIS GROWS IT</tspan></text><text x="800.0" y="267" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="800.0" dy="0">Support plants, crop residues and cover crops</tspan><tspan x="800.0" dy="33.4">turn sunlight, air, water and soil nutrients</tspan><tspan x="800.0" dy="33.4">into biomass.</tspan></text><rect x="1010" y="395" width="540" height="215" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="1280.0" y="449" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.4"><tspan x="1280.0" dy="0">2 · MANAGE AT THE RIGHT TIME</tspan></text><text x="1280.0" y="497" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="1280.0" dy="0">Prune · mow · chop · graze · harvest.</tspan><tspan x="1280.0" dy="33.4">Create light and redirect biomass into</tspan><tspan x="1280.0" dy="33.4">the next layer of the living system.</tspan></text><rect x="880" y="690" width="600" height="200" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="1180.0" y="744" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.4"><tspan x="1180.0" dy="0">3 · RETURN IT TO THE GROUND</tspan></text><text x="1180.0" y="792" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="1180.0" dy="0">Surface armour and decomposer habitat.</tspan><tspan x="1180.0" dy="33.4">Keep useful nutrients cycling locally,</tspan><tspan x="1180.0" dy="33.4">where biomass can safely decompose.</tspan></text><rect x="120" y="690" width="640" height="215" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="440.0" y="744" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.4"><tspan x="440.0" dy="0">4 · DECOMPOSERS DO THE QUIET WORK</tspan></text><text x="440.0" y="792" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="440.0" dy="0">Fungi, microbes and soil fauna transform</tspan><tspan x="440.0" dy="33.4">residues. Roots, pores and organic matter</tspan><tspan x="440.0" dy="33.4">shape how water and nutrients move.</tspan></text><rect x="50" y="395" width="540" height="215" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="320.0" y="449" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.4"><tspan x="320.0" dy="0">5 · NEXT GROWTH INHERITS</tspan></text><text x="320.0" y="497" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="320.0" dy="0">Shade, habitat, cooler soil and recycled</tspan><tspan x="320.0" dy="33.4">nutrients create new possibilities.</tspan><tspan x="320.0" dy="33.4">The loop begins again at a new stage.</tspan></text><g transform="translate(800 575) scale(1)" fill="none" stroke-linecap="round" filter="url(#rough)"><circle cx="0" cy="-128" r="30" fill="#b98d45" stroke="none" opacity=".9"/><path d="M-80 70 C-40 52 40 52 80 70" stroke="#8a6446" stroke-width="8"/><path d="M0 64 V-70" stroke="#6d5238" stroke-width="8"/><path d="M0 -20 C-20 -55 -70 -60 -88 -40 C-64 -18 -24 -14 0 -20Z" fill="#7f8f5d" stroke="#56653d" stroke-width="3"/><path d="M0 -40 C24 -78 72 -78 88 -56 C62 -34 26 -32 0 -40Z" fill="#7f8f5d" stroke="#56653d" stroke-width="3"/></g><text x="800" y="975" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0">Mediterranean note: biomass is fertility and also dry fuel. Place it with summer fire risk, access and buildings in mind.</tspan></text></svg>