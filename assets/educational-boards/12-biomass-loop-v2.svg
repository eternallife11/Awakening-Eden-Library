<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-labelledby="t d"><title id="t">Biomass: stored sunlight in motion</title><desc id="d">A five-step loop: photosynthesis grows biomass; it is managed at the right time; returned to the ground; decomposers transform it; and the next growth inherits shade, habitat and recycled nutrients.</desc><rect width="1600" height="1040" rx="36" fill="#f3ebd7"/><text x="800" y="82" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="800" dy="0.0">BIOMASS: STORED SUNLIGHT IN MOTION</tspan></text><text x="800" y="130" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0.0">Grow it · manage it · return it · let the next succession rise through it</tspan></text><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b98d45"/></marker></defs><path d="M1125 265 C1220 285 1270 330 1285 385" fill="none" stroke="#b98d45" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/><path d="M1290 630 C1290 660 1250 680 1220 688" fill="none" stroke="#b98d45" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/><path d="M875 800 C850 800 790 800 750 800" fill="none" stroke="#b98d45" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/><path d="M300 685 C290 660 300 650 310 632" fill="none" stroke="#b98d45" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/><path d="M310 390 C330 300 400 270 472 262" fill="none" stroke="#b98d45" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/><rect x="480" y="165" width="640" height="200" rx="30" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="800.0" y="217" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.5"><tspan x="800.0" dy="0.0">1 · PHOTOSYNTHESIS GROWS THE RESOURCE</tspan></text><text x="800.0" y="263" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="800.0" dy="0.0">Support plants, crop residues and cover crops</tspan><tspan x="800.0" dy="33.0">turn sunlight, air, water and soil nutrients</tspan><tspan x="800.0" dy="33.0">into biomass.</tspan></text><rect x="1010" y="395" width="540" height="230" rx="30" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="1280.0" y="447" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.5"><tspan x="1280.0" dy="0.0">2 · MANAGE AT THE RIGHT TIME</tspan></text><text x="1280.0" y="493" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="1280.0" dy="0.0">Prune · mow · chop · graze · harvest.</tspan><tspan x="1280.0" dy="33.0">Create light and redirect biomass into</tspan><tspan x="1280.0" dy="33.0">the next layer of the living system.</tspan><tspan x="1280.0" dy="33.0">Management moves succession forward.</tspan></text><rect x="880" y="690" width="600" height="210" rx="30" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="1180.0" y="742" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.5"><tspan x="1180.0" dy="0.0">3 · RETURN IT TO THE GROUND</tspan></text><text x="1180.0" y="788" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="1180.0" dy="0.0">Surface armour · decomposer habitat.</tspan><tspan x="1180.0" dy="33.0">Keep useful nutrients cycling locally.</tspan><tspan x="1180.0" dy="33.0">Retain biomass where it can safely decompose.</tspan></text><rect x="120" y="690" width="620" height="230" rx="30" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="430.0" y="742" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.5"><tspan x="430.0" dy="0.0">4 · DECOMPOSERS DO THE QUIET WORK</tspan></text><text x="430.0" y="788" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="430.0" dy="0.0">Fungi, microbes and soil fauna transform residues.</tspan><tspan x="430.0" dy="33.0">Roots, pores, aggregates and organic matter shape</tspan><tspan x="430.0" dy="33.0">how water and nutrients move through the soil.</tspan><tspan x="430.0" dy="33.0">Do not reduce soil life to one universal ratio.</tspan></text><rect x="50" y="395" width="540" height="230" rx="30" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="320.0" y="447" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.5"><tspan x="320.0" dy="0.0">5 · NEXT GROWTH INHERITS</tspan></text><text x="320.0" y="493" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="320.0" dy="0.0">Shade · habitat · moderated soil temperature</tspan><tspan x="320.0" dy="33.0">and recycled nutrients create possibilities.</tspan><tspan x="320.0" dy="33.0">The loop begins again at a new stage.</tspan><tspan x="320.0" dy="33.0">Observe → manage → regenerate → observe.</tspan></text><g transform="translate(800 575)" fill="none" stroke-linecap="round"><path d="M-80 70 C-40 52 40 52 80 70" stroke="#8a6446" stroke-width="8"/><path d="M0 64 V-70" stroke="#6d5238" stroke-width="8"/><path d="M0 -20 C-20 -55 -70 -60 -88 -40 C-64 -18 -24 -14 0 -20Z" fill="#7a8a5a" stroke="#56653d" stroke-width="3"/><path d="M0 -40 C24 -78 72 -78 88 -56 C62 -34 26 -32 0 -40Z" fill="#7a8a5a" stroke="#56653d" stroke-width="3"/><circle cx="0" cy="-128" r="30" fill="#b98d45" stroke="none"/></g><text x="800" y="985" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#6b5a45" text-anchor="middle" letter-spacing="0"><tspan x="800" dy="0.0">Mediterranean note: biomass is fertility and also potential dry fuel. Place and manage it with summer fire risk, access and buildings in mind.</tspan></text></svg>