<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2080" width="900" height="2080" role="img" aria-labelledby="t d"><title id="t">Biomass: stored sunlight in motion</title><desc id="d">A five-step loop: photosynthesis grows biomass; it is managed at the right time; returned to the ground; decomposers transform it; and the next growth inherits shade, habitat and recycled nutrients. Mediterranean note: biomass is also potential dry fuel.</desc><defs><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter><filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14" result="d"/><feGaussianBlur in="d" stdDeviation=".6"/></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b98d45"/></marker><marker id="aw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f8c8c"/></marker><linearGradient id="skyA" x2="0" y2="1"><stop stop-color="#f6e7cf"/><stop offset="1" stop-color="#f1dcc0"/></linearGradient><linearGradient id="skyB" x2="0" y2="1"><stop stop-color="#eef0df"/><stop offset="1" stop-color="#e3ead6"/></linearGradient><linearGradient id="soilA" x2="0" y2="1"><stop stop-color="#c99c74"/><stop offset="1" stop-color="#a56f52"/></linearGradient><linearGradient id="soilB" x2="0" y2="1"><stop stop-color="#8a6446"/><stop offset="1" stop-color="#5e4331"/></linearGradient></defs><rect width="900" height="2080" rx="36" fill="#f3ebd7"/><rect width="900" height="2080" rx="36" fill="#f3ebd7" filter="url(#grain)"/><text x="450" y="92" font-family="Georgia,'Times New Roman',serif" font-size="50" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="450" dy="0">BIOMASS:</tspan></text><text x="450" y="150" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="1"><tspan x="450" dy="0">STORED SUNLIGHT IN MOTION</tspan></text><text x="450" y="205" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Grow it · manage it · return it</tspan></text><g transform="translate(450 385) scale(0.85)" fill="none" stroke-linecap="round" filter="url(#rough)"><circle cx="0" cy="-128" r="30" fill="#b98d45" stroke="none" opacity=".9"/><path d="M-80 70 C-40 52 40 52 80 70" stroke="#8a6446" stroke-width="8"/><path d="M0 64 V-70" stroke="#6d5238" stroke-width="8"/><path d="M0 -20 C-20 -55 -70 -60 -88 -40 C-64 -18 -24 -14 0 -20Z" fill="#7f8f5d" stroke="#56653d" stroke-width="3"/><path d="M0 -40 C24 -78 72 -78 88 -56 C62 -34 26 -32 0 -40Z" fill="#7f8f5d" stroke="#56653d" stroke-width="3"/></g><rect x="60" y="470" width="780" height="245" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="450" y="528" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.3"><tspan x="450" dy="0">1 · PHOTOSYNTHESIS GROWS IT</tspan></text><text x="450" y="580" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Support plants, crop residues and cover crops</tspan><tspan x="450" dy="39.2">turn sunlight, air, water and soil nutrients</tspan><tspan x="450" dy="39.2">into biomass.</tspan></text><path d="M450 720 V752" stroke="#b98d45" stroke-width="7" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="760" width="780" height="245" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="450" y="818" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.3"><tspan x="450" dy="0">2 · MANAGE AT THE RIGHT TIME</tspan></text><text x="450" y="870" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Prune · mow · chop · graze · harvest.</tspan><tspan x="450" dy="39.2">Create light and redirect biomass into</tspan><tspan x="450" dy="39.2">the next layer of the living system.</tspan></text><path d="M450 1010 V1042" stroke="#b98d45" stroke-width="7" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="1050" width="780" height="245" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="450" y="1108" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.3"><tspan x="450" dy="0">3 · RETURN IT TO THE GROUND</tspan></text><text x="450" y="1160" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Surface armour and decomposer habitat.</tspan><tspan x="450" dy="39.2">Keep useful nutrients cycling locally,</tspan><tspan x="450" dy="39.2">where biomass can safely decompose.</tspan></text><path d="M450 1300 V1332" stroke="#b98d45" stroke-width="7" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="1340" width="780" height="245" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="450" y="1398" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.3"><tspan x="450" dy="0">4 · DECOMPOSERS DO THE QUIET WORK</tspan></text><text x="450" y="1450" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Fungi, microbes and soil fauna transform</tspan><tspan x="450" dy="39.2">residues. Roots, pores and organic matter</tspan><tspan x="450" dy="39.2">shape how water and nutrients move.</tspan></text><path d="M450 1590 V1622" stroke="#b98d45" stroke-width="7" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="1630" width="780" height="245" rx="28" fill="#fdf9ef" stroke="#7d8462" stroke-width="3"/><text x="450" y="1688" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#2f4a33" text-anchor="middle" letter-spacing="0.3"><tspan x="450" dy="0">5 · NEXT GROWTH INHERITS</tspan></text><text x="450" y="1740" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Shade, habitat, cooler soil and recycled</tspan><tspan x="450" dy="39.2">nutrients create new possibilities.</tspan><tspan x="450" dy="39.2">The loop begins again at a new stage.</tspan></text><path d="M840 1860 C890 1860 890 520 845 520" fill="none" stroke="#b98d45" stroke-width="5" stroke-dasharray="4 10" stroke-linecap="round" marker-end="url(#ah)"/><text x="450" y="1930" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="400" fill="#2f4a33" text-anchor="middle" letter-spacing="0" font-style="italic"><tspan x="450" dy="0">…and the loop begins again.</tspan></text><text x="450" y="2000" font-family="'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#5f4f3c" text-anchor="middle" letter-spacing="0"><tspan x="450" dy="0">Mediterranean note: biomass is fertility</tspan><tspan x="450" dy="36.4">and also dry fuel. Place it with summer fire</tspan><tspan x="450" dy="36.4">risk, access and buildings in mind.</tspan></text></svg>